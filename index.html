<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101318">
  <meta name="description" content="ShootBook — organize your photography sessions.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>ShootBook</title>
  <style>
    :root{color-scheme:dark;--bg:#101318;--panel:#191f28;--panel2:#222a35;--line:#303a48;--text:#f3f5f8;--muted:#9ba8b8;--accent:#b7d7ff;--green:#7bd6ae;--yellow:#f2c879;--red:#f18c8c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,textarea,select{font:inherit}button{cursor:pointer}
    .shell{max-width:1050px;margin:auto;padding:22px 18px 100px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
    .brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:#28394c;display:grid;place-items:center;font-size:22px}
    h1{font-size:25px;margin:0;letter-spacing:-.7px} .sub{color:var(--muted);font-size:12px}
    .btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:11px;font-weight:600}
    .btn.primary{background:var(--accent);color:#101820;border-color:var(--accent)}.btn.small{padding:7px 10px;font-size:13px}
    .tabs{display:flex;gap:7px;margin-bottom:22px;overflow:auto}.tab{border:1px solid var(--line);background:transparent;color:var(--muted);padding:9px 14px;border-radius:999px;white-space:nowrap}.tab.active{background:var(--panel2);color:var(--text);border-color:#536276}
    .hero{background:linear-gradient(135deg,#25364a,#1b2430 65%,#202b36);border:1px solid #3b4b5e;border-radius:20px;padding:22px;margin-bottom:20px}
    .hero h2{font-size:22px;margin:0 0 5px}.hero p{margin:0;color:#c2cfdd}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 24px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
    .stat strong{display:block;font-size:25px}.stat span{color:var(--muted);font-size:12px}
    .sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px}.sectionhead h2{font-size:17px;margin:0}
    .shoots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .shoot-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
    .shoot-card h3{font-size:16px;margin:0 0 5px}.meta{color:var(--muted);font-size:13px}.pill{display:inline-block;border-radius:999px;padding:4px 9px;font-size:11px;background:#2c3948;color:#c7dfff;margin-top:10px}
    .empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{flex:1;min-width:180px}
    input,textarea,select{width:100%;background:#111720;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px;outline:none}
    input:focus,textarea:focus,select:focus{border-color:#829fbe}textarea{min-height:76px;resize:vertical}
    label{display:block;color:var(--muted);font-size:12px;margin:11px 0 5px}
    .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}
    .modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:5}.modal.open{display:flex}
    .dialog{width:min(680px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
    .dialoghead{display:flex;justify-content:space-between;align-items:center;gap:10px}.dialoghead h2{font-size:19px;margin:0}
    .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
    .detail-list{display:grid;gap:9px}.detail-row{padding:12px;background:#121922;border-radius:11px}.detail-row b{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
    .checkrow{display:flex;align-items:center;gap:9px;padding:7px 0}.checkrow input{width:auto}
    .muted{color:var(--muted)}.danger{color:var(--red)}.weather{margin-top:10px;padding:12px;background:#121922;border-radius:12px}
    footer{text-align:center;color:#718093;font-size:11px;margin-top:28px}
    @media(max-width:650px){.shell{padding:16px 14px 90px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}.shoots{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.hero{padding:18px}}
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand"><div class="logo">📷</div><div><h1>ShootBook</h1><div class="sub">YOUR PHOTOGRAPHY WORKSPACE</div></div></div>
    <button class="btn primary" id="newShoot">＋ New shoot</button>
  </header>
  <nav class="tabs" aria-label="Main navigation">
    <button class="tab active" data-view="dashboard">Overview</button>
    <button class="tab" data-view="shoots">All shoots</button>
    <button class="tab" data-view="backup">Backup & settings</button>
  </nav>
  <main id="app"></main>
  <footer>ShootBook · Your information stays in this browser on this device.</footer>
</div>

<div class="modal" id="modal">
  <section class="dialog">
    <div class="dialoghead"><h2 id="formTitle">New photoshoot</h2><button class="btn small" id="closeModal" aria-label="Close">✕</button></div>
    <form id="shootForm">
      <input type="hidden" id="shootId">
      <div class="formgrid">
        <div class="full"><label for="title">Shoot name *</label><input id="title" required placeholder="e.g. Senior portraits"></div>
        <div><label for="date">Date *</label><input id="date" type="date" required></div>
        <div><label for="time">Start time</label><input id="time" type="time"></div>
        <div><label for="type">Shoot type</label><select id="type"><option>Portrait</option><option>Sports</option><option>Event</option><option>Landscape</option><option>Family</option><option>Commercial</option><option>Other</option></select></div>
        <div><label for="status">Status</label><select id="status"><option>Planning</option><option>Scheduled</option><option>Completed</option><option>Delivered</option></select></div>
        <div><label for="client">Client name</label><input id="client" placeholder="Client or organization"></div>
        <div><label for="contact">Client contact</label><input id="contact" placeholder="Email or phone (optional)"></div>
        <div class="full"><label for="location">Location</label><input id="location" placeholder="Venue, park, address, etc."></div>
        <div><label for="fee">Agreed price ($)</label><input id="fee" type="number" min="0" step="0.01" placeholder="0.00"></div>
        <div><label for="paid">Payment status</label><select id="paid"><option>Not paid</option><option>Deposit paid</option><option>Paid in full</option><option>No charge</option></select></div>
        <div class="full"><label for="notes">Notes / ideas</label><textarea id="notes" placeholder="Schedule, poses, client requests..."></textarea></div>
        <div class="full"><label for="shots">Shot list (one idea per line)</label><textarea id="shots" placeholder="Wide establishing shot&#10;Close-up portrait&#10;Candid moments"></textarea></div>
        <div class="full"><label for="gear">Equipment checklist (one item per line)</label><textarea id="gear" placeholder="Camera body&#10;Lens&#10;Charged batteries&#10;Memory cards"></textarea></div>
        <div class="full"><label for="inspiration">Photo inspiration links (one URL per line)</label><textarea id="inspiration" placeholder="https://example.com/reference-photo"></textarea></div>
      </div>
      <div class="actions"><button type="button" class="btn" id="cancelForm">Cancel</button><button class="btn primary" type="submit">Save photoshoot</button></div>
    </form>
  </section>
</div>
<script src="./app.js"></script>
</body>
</html>
